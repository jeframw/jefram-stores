<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager Login - Jefram Stores</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            display: none;
            border: 2px solid;
        }

        .message.error {
            background: #fee;
            color: #c33;
            border-color: #fcc;
            display: block;
        }

        .message.success {
            background: #efe;
            color: #3c3;
            border-color: #cfc;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Product Manager Login</h2>
        <div class="subtitle">Jefram Stores - Product Management</div>
        <input type="email" id="email" placeholder="Email" autocomplete="email">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn" type="button">Login</button>
        <div id="message" class="message"></div>
    </div>

    <script src="../api.js"></script>
    <script>
        console.log('Product Manager Login page loaded');
        
        async function handleLogin(e) {
            if (e) e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');

            console.log('Email:', email);
            console.log('Password provided:', password ? 'yes' : 'no');

            messageDiv.className = 'message';
            messageDiv.textContent = '';

            if (!email || !password) {
                messageDiv.textContent = 'Please enter email and password';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const result = await JeframAPI.productManagerLogin(email, password);
                console.log('Login successful:', result);
                localStorage.setItem('jefram_token', result.token);
                localStorage.setItem('jefram_user', JSON.stringify(result.user));
                messageDiv.textContent = 'Login successful! Redirecting...';
                messageDiv.className = 'message success';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (error) {
                console.error('Login error:', error);
                messageDiv.textContent = error.message || 'Invalid email or password. Please try again.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                document.getElementById('password').focus();
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, adding event listener');
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.addEventListener('click', handleLogin);
            }
            
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
            document.getElementById('email').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
        });
    </script>
</body>
</html>
