services:
  - type: web
    name: jefram-stores
    runtime: node
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run migrate && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jefram-stores-db-frankfurt
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: jefram-stores-db-frankfurt
    region: frankfurt
    databaseName: jefram_stores
    user: jefram_user
