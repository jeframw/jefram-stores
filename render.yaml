services:
  - type: web
    name: jefram-stores
    runtime: node
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jefram-stores-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: jefram-stores-db
    databaseName: jefram_stores
    user: jefram_user
